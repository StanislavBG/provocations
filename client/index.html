    <script>
      // Apply saved palette + theme before first paint to prevent flash
      (function(){
        var p=localStorage.getItem('provocations-palette');
        if(p&&p!=='ember')document.documentElement.classList.add('palette-'+p);
        var t=localStorage.getItem('theme');
        if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))
          document.documentElement.classList.add('dark');
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- AIQA QA Overlay -->
    <style>
      /* Minimal — just ensure AIQA is on top, let overlay.js handle its own layout */
      #aiqa-overlay-root {
        z-index: 2147483647 !important;
      }
    </style>
    <script src="https://aiqastudio.com/snippet.js" data-base-url="https://aiqastudio.com"></script>
    <script>
      // AIQA Debug v3 — deep mutation tracking inside overlay root
      (function() {
        var TAG = '[AIQA-DEBUG]';
        var log = function() { console.log.apply(console, [TAG].concat(Array.prototype.slice.call(arguments))); };
        var warn = function() { console.warn.apply(console, [TAG].concat(Array.prototype.slice.call(arguments))); };

        // Capture all errors from overlay.js
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('aiqastudio') !== -1) {
            warn('SCRIPT ERROR in', e.filename, 'line', e.lineno, ':', e.message);
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          var msg = e.reason && (e.reason.message || String(e.reason));
          if (msg && msg.indexOf('aiqa') !== -1) warn('UNHANDLED REJECTION:', msg);
        });

        // Watch for overlay root to appear, then deeply observe it
        var rootObserver = new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(n) {
              if (n.nodeType !== 1) return;
              if (n.id === 'aiqa-overlay-root') {
                log('overlay-root ADDED. Attaching deep observer.');
                attachDeepObserver(n);
                // Dump state after overlay.js has time to render
                setTimeout(function() { dumpElement(n, 0); }, 2000);
                setTimeout(function() { dumpElement(n, 0); }, 5000);
              }
              if (n.id === 'aiqa-overlay-styles') {
                log('overlay-styles ADDED. CSS length:', n.textContent.length);
              }
            });
            m.removedNodes.forEach(function(n) {
              if (n.nodeType === 1 && n.id && n.id.indexOf('aiqa') !== -1) {
                warn('REMOVED:', n.tagName, '#' + n.id);
              }
            });
          });
        });
        rootObserver.observe(document.documentElement, { childList: true, subtree: true });

        function attachDeepObserver(root) {
          var deepObs = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
              if (m.type === 'childList') {
                m.addedNodes.forEach(function(n) {
                  if (n.nodeType === 1) {
                    log('CHILD ADDED inside overlay-root:', n.tagName,
                      n.id ? '#' + n.id : '', n.className ? '.' + n.className.toString().split(' ').join('.') : '',
                      'innerHTML:', (n.innerHTML || '').slice(0, 200));
                  }
                });
                m.removedNodes.forEach(function(n) {
                  if (n.nodeType === 1) {
                    warn('CHILD REMOVED from overlay-root:', n.tagName,
                      n.id ? '#' + n.id : '', n.className ? '.' + n.className.toString().split(' ').join('.') : '');
                  }
                });
              }
              if (m.type === 'attributes') {
                log('ATTR CHANGED on', m.target.tagName,
                  m.target.id ? '#' + m.target.id : '',
                  'attr:', m.attributeName, '=', m.target.getAttribute(m.attributeName));
              }
            });
          });
          deepObs.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class', 'src'] });
        }

        function dumpElement(el, depth) {
          var indent = '  '.repeat(depth);
          var s = window.getComputedStyle(el);
          var r = el.getBoundingClientRect();
          log(indent + el.tagName + (el.id ? '#' + el.id : '') + (el.className ? '.' + el.className.toString().split(' ')[0] : ''),
            '| rect:', Math.round(r.width) + 'x' + Math.round(r.height), '@', Math.round(r.left) + ',' + Math.round(r.top),
            '| display:', s.display, '| vis:', s.visibility, '| opacity:', s.opacity,
            '| pos:', s.position, '| z:', s.zIndex, '| overflow:', s.overflow);
          if (el.tagName === 'IFRAME') {
            log(indent + '  iframe src:', el.src);
          }
          if (el.shadowRoot) {
            log(indent + '  HAS SHADOW ROOT with', el.shadowRoot.children.length, 'children');
          }
          for (var i = 0; i < el.children.length && depth < 4; i++) {
            dumpElement(el.children[i], depth + 1);
          }
        }

        // Also log window.AIQA state
        var poll = setInterval(function() {
          if (!window.AIQA) return;
          clearInterval(poll);
          log('window.AIQA keys:', Object.keys(window.AIQA));
          log('localStorage aiqa:', Object.keys(localStorage).filter(function(k) { return k.toLowerCase().indexOf('aiqa') !== -1; }));
        }, 300);

        log('Debug v3 installed');
      })();
    </script>
